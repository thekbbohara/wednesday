# Terminal chat:   docker compose run --rm jarvis
# One turn:        docker compose run --rm jarvis ask "what are we doing?"
services:
  jarvis:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: jarvis
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    volumes:
      # Memory. A named volume by default; to use a host folder, create it first (mkdir) and set JARVIS_DATA.
      - ${JARVIS_DATA:-jarvis-data}:/data
      # Claude Code login (and its session transcripts).
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json

volumes:
  jarvis-data:
