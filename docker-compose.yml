# Web chat:        docker compose up -d        -> http://127.0.0.1:4788
# Terminal chat:   docker compose exec majordomo node src/cli.ts
# Watch an agent:  docker compose exec majordomo tmux -L majordomo attach -t majordomo_<name>
services:
  majordomo:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: majordomo
    restart: unless-stopped
    ports:
      # Localhost only. To reach it from other devices, set MAJORDOMO_TOKEN and bind
      # a private address (e.g. your Tailscale IP) instead of 127.0.0.1.
      - ${MAJORDOMO_BIND:-127.0.0.1}:${MAJORDOMO_PORT:-4788}:4788
    env_file:
      - path: .env
        required: false
    volumes:
      # Memory. A named volume by default; to use a host folder, create it first (mkdir) and set MAJORDOMO_DATA.
      - ${MAJORDOMO_DATA:-majordomo-data}:/data
      # Claude Code and Codex logins (and their session transcripts).
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json
      - ${HOME}/.codex:/home/node/.codex
      # Your git identity, for the agents' commits.
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
      # Projects agents work on, at the same path as on the host, so the paths
      # you mention in the chat mean the same thing inside the container.
      - ${PROJECTS_DIR:-${HOME}/projects}:${PROJECTS_DIR:-${HOME}/projects}

volumes:
  majordomo-data:
