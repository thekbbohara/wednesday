# Web chat:        docker compose up -d        -> http://127.0.0.1:4788
# Terminal chat:   docker compose exec jarvis node src/cli.ts
services:
  jarvis:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: jarvis
    restart: unless-stopped
    ports:
      # Localhost only. To reach it from other devices, set JARVIS_TOKEN and bind
      # a private address (e.g. your Tailscale IP) instead of 127.0.0.1.
      - ${JARVIS_BIND:-127.0.0.1}:${JARVIS_PORT:-4788}:4788
    env_file:
      - path: .env
        required: false
    volumes:
      # Memory. A named volume by default; to use a host folder, create it first (mkdir) and set JARVIS_DATA.
      - ${JARVIS_DATA:-jarvis-data}:/data
      # Claude Code login (and its session transcripts).
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json

volumes:
  jarvis-data:
